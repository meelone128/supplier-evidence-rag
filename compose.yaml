name: supplierevidence

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "./qdrant", "--version"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      RAG_CONFIG: configs/supplier_evidence.docker.yaml
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8002:8002"
    volumes:
      - supplier_pending_uploads:/app/data/supplier_evidence/pending_uploads
      - supplier_uploaded_sources:/app/data/supplier_evidence/uploads
      - supplier_audit:/app/data/supplier_evidence/audit
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./app/frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5172:80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_data:
  supplier_pending_uploads:
  supplier_uploaded_sources:
  supplier_audit:
