<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">SupplierEvidence architecture</title><desc id="desc">供应商材料经过混合检索、证据门禁、输出门禁与人工复核</desc>
  <defs><style>.t{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#102a56}.h{font-size:22px;font-weight:700}.s{font-size:16px;fill:#486487}.c{fill:#fff;stroke:#bdd0ea;stroke-width:2}.b{fill:#ecf3ff;stroke:#4e8df7;stroke-width:2}.g{fill:#eaf9f1;stroke:#29a36a;stroke-width:2}.o{fill:#fff1ef;stroke:#db6557;stroke-width:2}.l{stroke:#7297c7;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7297c7"/></marker></defs>
  <rect width="1200" height="520" rx="24" fill="#f6f9fd"/><text x="56" y="65" class="t h">SupplierEvidence · 可追溯供应商证据核验架构</text><text x="56" y="97" class="t s">RAG 用于发现与解释，确定性规则保障材料、时效、冲突与引用边界</text>
  <rect x="45" y="197" width="150" height="82" rx="14" class="c"/><text x="72" y="232" class="t h">核验请求</text><text x="65" y="258" class="t s">供应商 / 品类 / 地区</text><path d="M195 238H260" class="l"/>
  <rect x="260" y="160" width="220" height="155" rx="16" class="b"/><text x="293" y="198" class="t h">Hybrid Retrieval</text><text x="300" y="231" class="t s">范围过滤</text><text x="300" y="258" class="t s">BM25 + Qdrant</text><text x="300" y="285" class="t s">RRF 融合排序</text><path d="M480 238H540" class="l"/>
  <rect x="540" y="160" width="190" height="155" rx="16" class="o"/><text x="568" y="198" class="t h">Evidence Gate</text><text x="568" y="231" class="t s">材料缺失</text><text x="568" y="258" class="t s">有效期与冲突</text><text x="568" y="285" class="t s">来源权威性</text><path d="M730 238H790" class="l"/>
  <rect x="790" y="160" width="175" height="155" rx="16" class="b"/><text x="812" y="198" class="t h">LLM 说明</text><text x="812" y="231" class="t s">结构化报告</text><text x="812" y="258" class="t s">候选引用 ID</text><text x="812" y="285" class="t s">可选生成</text><path d="M965 238H1015" class="l"/>
  <rect x="1015" y="160" width="145" height="155" rx="16" class="g"/><text x="1033" y="198" class="t h">Output Gate</text><text x="1045" y="231" class="t s">引用校验</text><text x="1045" y="258" class="t s">无证据拦截</text><text x="1045" y="285" class="t s">可追溯输出</text><path d="M1087 315V405H730" class="l"/>
  <rect x="430" y="376" width="300" height="80" rx="14" class="g"/><text x="475" y="410" class="t h">人工复核与审计事件</text><text x="452" y="438" class="t s">冲突确认、状态流转、备注与知识运营</text>
</svg>
